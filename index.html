<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">

        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        >


        <title>Clovolt | Fashion Blog</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">

        <link
            rel="preconnect"
            href="https://fonts.gstatic.com"
            crossorigin
        >

        <link
            href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        >

        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        >

        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/header.css">
        <link rel="stylesheet" href="css/footer.css">
    </head>

    <body>
        <div id="header-container"></div>

        <main>
            <section
                class="hero"
                aria-label="Featured fashion stories">

                <div class="hero-slides">
                    <article class="hero-slide active">
                        <div class="hero-content"></div>
                        <div class="hero-image"></div>
                    </article>
                </div>
            </section>
        </main>

        <div id="footer-container"></div>

        <script src="js/header.js"></script>
        <script src="js/footer.js"></script>
        <script src="js/main.js"></script>
    </body>
</html>
