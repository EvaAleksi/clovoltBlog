<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">

        <meta 
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        >

        <meta
            name="description"
            content="Explore complete Clovolt outfits and discover the individual pieces behind every look."
        >

        <title>Clovolt | Shop the Look</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">

        <link
            rel="preconnect"
            href="https://fonts.gstatic.com"
            crossorigin
        >

        <link
            href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        >

        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        >

        <link rel="stylesheet" href="css/style.css">
    </head>

    <body>
        <div id="header-container"></div>

        <main class="shop-page">
            <section class="page-introduction">
                <h1>Shop the Look</h1>

                <div class="page-title-line" aria-hidden="true"></div>

                <p class="page-description">
                    Discover complete outfits and explore every piece behind each look.
                </p>

                <form
                    class="content-search"
                    id="shop-search-form"
                    role="search">

                    <div class="search-field">
                        <i class="fa-brands fa-searchengin" aria-hidden="true"></i>

                        <input
                            type="search"
                            id="shop-search-input"
                            name="search"
                            placeholder="Search looks by style or description..."
                            aria-label="Search looks by style or description"
                            autocomplete="off"
                        >
                    </div>

                    <button class="search-button" type="submit">Search</button>
                </form>
            </section>

            <section class="content-filters" aria-labelledby="style-filter-heading">
                <h2 id="style-filter-heading">Browse by Style</h2>

                <div 
                    class="filter-list"
                    role="group"
                    aria-label="Filter looks by style">

                    <button
                        class="filter-button active"
                        type="button"
                        data-style="all"
                        aria-pressed="true">
                    
                        All Looks
                    </button>

                    <button
                        class="filter-button"
                        type="button"
                        data-style="casual"
                        aria-pressed="false">

                        Casual
                    </button>

                    <button
                        class="filter-button"
                        type="button"
                        data-style="streetwear"
                        aria-pressed="false">

                        Streetwear
                    </button>

                    <button
                        class="filter-button"
                        type="button"
                        data-style="sporty"
                        aria-pressed="false">

                        Sporty
                    </button>

                    <button
                        class="filter-button"
                        type="button"
                        data-style="chic"
                        aria-pressed="false">

                        Chic
                    </button>
                </div>
            </section>

            <section class="results-section" aria-labelledby="shop-results-heading">
                <div class="section-heading">
                    <h2 id="shop-results-heading">All Looks</h2>

                    <p
                        class="results-count"
                        id="shop-results-count"
                        aria-live="polite">
                    </p>
                </div>

                <div class="shop-look-grid" id="shop-look-grid">
                    <p class="loading-message">Loading looks...</p>
                </div>

                <p 
                    class="no-results-message"
                    id="shop-no-results"
                    role="status"
                    hidden>

                    No looks match your search or selected style.
                </p>

                <div 
                    class="load-more-container"
                    id="shop-load-more-container"
                    hidden>

                    <button
                        class="load-more-button"
                        id="shop-load-more-button"
                        type="button">

                        Load More
                    </button>
                </div>
            </section>
        </main>

        <div id="footer-container"></div>

        <script src="js/header.js"></script>
        <script src="js/footer.js"></script>
        <script type="module" src="js/shop-the-look.js"></script>
    </body>
</html>
