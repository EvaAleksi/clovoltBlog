<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">

        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        >

        <meta
            name="description"
            content="View and manage the Clovolt articles and looks you have saved."
        >

        <title>Clovolt | Favorites</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">

        <link
            rel="preconnect"
            href="https://fonts.gstatic.com"
            crossorigin
        >

        <link
            href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        >

        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        >

        <link rel="stylesheet" href="css/global.css">
        <link rel="stylesheet" href="css/header.css">

        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/shop-the-look.css">

        <link rel="stylesheet" href="css/favorites.css">
        <link rel="stylesheet" href="css/footer.css">
    </head>

    <body>
        <div id="header-container"></div>

        <main class="favorites-page">
            <section class="favorites-introduction">
                <h1>Your Favorites</h1>

                <div
                    class="favorites-title-line"
                    aria-hidden="true">
                </div>

                <p class="favorites-description">
                    Everything you saved, organized in one personal collection.
                </p>
            </section>

            <section
                class="favorites-summary"
                aria-labelledby="favorites-summary-title">

                <div class="favorites-summary-main">
                    <p class="section-label">
                        YOUR SAVED COLLECTION
                    </p>

                    <h2
                        class="favorites-total-count"
                        id="favorites-summary-title"
                        aria-live="polite">

                        0 items saved
                    </h2>
                </div>

                <div
                    class="favorites-summary-counts"
                    role="group"
                    aria-label="Saved collection totals">

                    <p>
                        <strong id="favorite-articles-count">0</strong>
                        <span>Articles</span>
                    </p>

                    <p>
                        <strong id="favorite-looks-count">0</strong>
                        <span>Looks</span>
                    </p>
                </div>
            </section>

            <div
                class="favorites-tabs"
                role="tablist"
                aria-label="Choose a favorites collection">

                <button
                    class="favorites-tab active"
                    id="saved-articles-tab"
                    type="button"
                    role="tab"
                    data-tab="articles"
                    aria-controls="saved-articles-panel"
                    aria-selected="true">

                    Saved Articles
                </button>

                <button
                    class="favorites-tab"
                    id="saved-looks-tab"
                    type="button"
                    role="tab"
                    data-tab="looks"
                    aria-controls="saved-looks-panel"
                    aria-selected="false"
                    tabindex="-1">

                    Saved Looks
                </button>
            </div>

            <section
                class="favorites-panel"
                id="saved-articles-panel"
                role="tabpanel"
                aria-labelledby="saved-articles-tab">

                <div class="section-heading favorites-section-heading">
                    <h2>Saved Articles</h2>

                    <p
                        class="favorites-panel-count"
                        id="saved-articles-panel-count"
                        aria-live="polite">
                    </p>
                </div>

                <div
                    class="articles-grid"
                    id="saved-articles-grid">
                </div>
            </section>

            <section
                class="favorites-panel"
                id="saved-looks-panel"
                role="tabpanel"
                aria-labelledby="saved-looks-tab"
                hidden>

                <div class="section-heading favorites-section-heading">
                    <h2>Saved Looks</h2>

                    <p
                        class="favorites-panel-count"
                        id="saved-looks-panel-count"
                        aria-live="polite">
                    </p>
                </div>

                <div
                    class="shop-look-grid"
                    id="saved-looks-grid">
                </div>
            </section>
        </main>

        <div id="footer-container"></div>

        <script src="js/header.js"></script>
        <script src="js/footer.js"></script>

        <script
            type="module"
            src="js/favorites-page.js">
        </script>
    </body>
</html>
